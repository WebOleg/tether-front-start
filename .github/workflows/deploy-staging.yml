name: Deploy Frontend (Staging)

on:
  push:
    branches: ["staging"]

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            REPO_DIR="/opt/tether-staging/frontend"
            COMPOSE="docker compose -f docker-compose.staging.yml"

            cd "$REPO_DIR"

            echo "== whoami =="; whoami; id
            echo "== repo perms =="; ls -ld .git .git/objects .git/objects/pack || true

            # --- Git self-heal (prevents 'insufficient permission' + stale locks) ---
            sudo chown -R "${USER}:${USER}" .git || true
            sudo chmod -R u+rwX .git || true
            sudo rm -f .git/index.lock .git/packed-refs.lock .git/objects/pack/*.lock || true

            # Retry fetch
            for i in 1 2 3; do
              git fetch --all --prune && break
              echo "git fetch failed (attempt $i). retrying..."
              sleep 2
            done

            git checkout -B staging origin/staging
            git reset --hard origin/staging

            $COMPOSE build
            $COMPOSE up -d

            $COMPOSE ps
